name: cfta

services:
  postgres:
    image: postgres:16-alpine
    container_name: cfta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cfta_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cfta_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-cfta_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cfta_user} -d ${POSTGRES_DB:-cfta_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrate:
    build:
      context: .
      target: api
    container_name: cfta-db-migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-cfta_user}:${POSTGRES_PASSWORD:-cfta_secure_password}@postgres:5432/${POSTGRES_DB:-cfta_db}?schema=public}
    command: pnpm --filter=@cfta/database exec prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    container_name: cfta-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-cfta_user}:${POSTGRES_PASSWORD:-cfta_secure_password}@postgres:5432/${POSTGRES_DB:-cfta_db}?schema=public}
      TRON_NETWORK_URL: ${TRON_NETWORK_URL:-https://api.trongrid.io}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: cfta-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
