name: cfta

services:
  db-migrate:
    build:
      context: .
      target: api
    container_name: cfta-db-migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: pnpm --filter=@cfta/database exec prisma migrate deploy

  api:
    build:
      context: .
      target: api
    container_name: cfta-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      TRON_NETWORK_URL: ${TRON_NETWORK_URL:-https://api.trongrid.io}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY}
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: cfta-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy