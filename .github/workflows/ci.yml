name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DATABASE_URL: postgresql://cfta_user:cfta_secure_password@localhost:5432/cfta_db?schema=public

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9.0.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@cfta/database exec prisma generate
      - run: pnpm run check-types
      - run: pnpm run lint

  build:
    name: Build Monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9.0.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@cfta/database exec prisma generate
      - run: pnpm run build

  docker-test:
    name: Docker Integration Test
    runs-on: ubuntu-latest
    needs: [ quality, build ]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - run: sleep 10
      - run: curl -f http://localhost:4000/health
      - run: curl -f http://localhost:3000/
      - run: docker compose down -v